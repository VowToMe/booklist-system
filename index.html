    <div class="sec habit-sec" id="habitSec"></div>
    <div class="sec" id="topics"></div>
  </nav>

  <section class="list-col">
    <div class="lhead">
      <div class="where" id="where"></div>
      <div class="grow"></div>
      <input type="search" id="q" aria-label="搜索书名、作者、理由" placeholder="搜书名、作者、理由">
    </div>
    <div class="rows" id="rows"><div class="empty">读入中…</div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-t"></span><button id="undo">撤销</button></div>
    <div class="bulkbar" id="bulkbar" role="toolbar" aria-label="批量标记">
      <span class="cnt" id="bulkcnt"></span>
      <button data-bv="想读">想读</button>
      <button data-bv="在读">在读</button>
      <button data-bv="读完">读完</button>
      <button data-bv="踢掉">踢掉</button>
      <span class="grow"></span>
      <button class="lnk" id="pickall">全选本页</button>
      <button class="lnk" id="picknone">清空选择</button>
      <button class="lnk" id="bulkexit" title="退出批量模式（Esc）">退出</button>
    </div>
  </section>

  <div class="turn-stage closed" id="turn-stage" aria-hidden="true">
    <div class="folio-glint" aria-hidden="true"></div>
    <aside class="detail" id="detail" aria-label="书籍详情"></aside>
  </div>
</div>
<div class="rowmenu" id="rowmenu" role="menu" aria-label="这本书的操作"></div>

<script>
"use strict";
const SHELVES = [
  ["全部","全部"], ["想读","想读"], ["在读","在读"], ["读完","读完"], ["踢掉","踢掉"]
];
const VERDICTS = ["想读","在读","读完","踢掉"];
const EVALS = ["好看","一般","不好看"];
const EVAL_CLS = {"好看":"good","一般":"mid","不好看":"bad"};
const TURN_EASE = "cubic-bezier(.23,1,.32,1)";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toLocaleDateString("sv-SE");   // YYYY-MM-DD
const shortDate = d => !d ? "" : (d.length===10 ? d.slice(5) : d);
/* 2026 / 2026-09 / 2026-09-28 三种精度, 且必须是真实存在的日历日 */
function dateOk(v){
  if (!/^\d{4}(-\d{2}(-\d{2})?)?$/.test(v)) return false;
  const p = v.split("-").map(Number);
  if (p[0] < 1900 || p[0] > 2100) return false;
  if (p.length < 2) return true;
  if (p[1] < 1 || p[1] > 12) return false;
  if (p.length < 3) return true;
  return p[2] >= 1 && p[2] <= new Date(p[0], p[1], 0).getDate();
}

const S = { books:[], orphans:[], shelf:"全部", topic:"全部", q:"", sel:null, open:false, orphan:null,
            undo:[], toastTimer:null, pend:null, timer:null, markLock:0, markTarget:null,
            bulk:false, picked:new Set(), stats:false, habit:false, rd:null, rdTotals:null,
            rdUnmatched:[], rdAvail:false,
            rdRange:(()=>{ try{ const v = localStorage.getItem("bl.rdRange");
              return ["week","month","year"].includes(v) ? v : "year"; }catch{ return "year"; } })() };

/* 记录可能属于底本里的书, 也可能是「底本里已没有」的孤儿 —— 两条路都要能读写 */
const find = name => S.books.find(x=>x.书名===name) || S.orphans.find(x=>x.书名===name);
const current = () => find(S.orphan || S.sel);

/* ── 数据 ─────────────────────────────────────────── */
async function load(){
  let d;
  try{
    const r = await fetch("/api/books");
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ("HTTP " + r.status));
    d = await r.json();
  }catch(e){ renderLoadFail(e.message); return; }
  S.books = d.books; S.orphans = d.orphans || [];
  S.rdAvail = !!d.readest_available;
  S.rdTotals = d.readest_totals || null;
  S.rdUnmatched = d.readest_unmatched || [];
  try{
    const rr = await fetch("/api/readest");
    S.rd = rr.ok ? await rr.json() : null;
  }catch{ S.rd = null; }
  if (S.sel && !S.books.some(b=>b.书名===S.sel)) S.sel = null;
  if (S.orphan && !S.orphans.some(o=>o.书名===S.orphan)) S.orphan = null;
  syncTopic();
  // 选中那本可能刚被移出眼前这一栏 —— 批量踢掉走的是「整表重画」这条路, 重画完 S.sel 还挂着它,
  // 右栏就会停在一本列表里已经没有的书上(标题下面还写「不在当前筛选里」)。
  // setVerdict 里那段「落到原位置下一本」是同一件事, 这句兜住所有入口。
  if (S.sel && !visible().some(b=>b.书名===S.sel)) S.sel = (visible()[0]||{}).书名 || null;
  renderRail(); renderList(); renderDetail();
}

function renderLoadFail(msg){
  S.books = []; S.orphans = []; S.sel = null; S.orphan = null;
  S.rd = null; S.rdAvail = false;
  renderRail(); renderList();
  const d = $("#detail");
  d.innerHTML = `<div class="blank">读不到书单。<br>${esc(msg)}<br>
    <button class="mini" id="retry" style="margin-top:14px">重试</button></div>`;
  d.classList.add("open");
  S.open = true;
}

function patchLocal(name, rec){
  const b = find(name);
  if (b) Object.assign(b, rec);
  return b;
}

/* 未落盘的输入: 同一时刻只挂一本书, 攒够 800ms 或换书/失焦时一次写掉 */
function queueSave(name, patch){
  if (S.pend && S.pend.name !== name) flushPending();
  if (!S.pend) S.pend = {name, patch:{}};
  Object.assign(S.pend.patch, patch);
  clearTimeout(S.timer);
  S.timer = setTimeout(flushPending, 800);
}

function flushPending(){
  const p = S.pend;
  clearTimeout(S.timer); S.timer = null;
  if (!p) return Promise.resolve(null);
  S.pend = null;
  const patch = p.patch;
  if (!Object.keys(patch).length) return Promise.resolve(null);
  const b = find(p.name);
  return post(p.name, patch).then(res=>{
    const rec = res && res.记录;
    if (res && res.书名 && res.书名 !== p.name){ load(); return rec; }   // 底本改过名 → 整页重来
    if (b && rec) Object.assign(b, rec);
    if (patch.开始日 !== undefined || patch.读完日 !== undefined) renderList();
    saved();
    return rec;
  }).catch(e=>{ showToast("没存上：" + e.message, false); return null; });
}

async function post(name, payload){
  const body = JSON.stringify(Object.assign({书名:name}, payload));
  const opt = {method:"POST", headers:{"Content-Type":"application/json"}, body};
  if (body.length < 60000) opt.keepalive = true;   // 关标签页/关窗口时也能送出(>64KB 会被浏览器拒)
  const r = await fetch("/api/save", opt);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ("HTTP " + r.status));
  return await r.json();                            // {ok, 记录, 书名}
}

function matches(b){
  if (!b) return false;
  if (S.shelf === "全部"){ if (b.判定 === "踢掉") return false; }
  else if (b.判定 !== S.shelf) return false;
  /* 清单是多对多: 一本书同时在「决策能力」和别的清单里, 两个栏里都该看得到它 */
  if (S.topic !== "全部" && !(b.清单||[]).includes(S.topic)) return false;
  const q = S.q.trim().toLowerCase();
  if (q && !((b.书名+" "+b.作者+" "+b.为什么加+" "+b.备注).toLowerCase().includes(q))) return false;
  return true;
}
const visible = () => S.books.filter(matches);

function counts(){
  const c = {全部:0, 想读:0, 在读:0, 读完:0, 踢掉:0};
  for (const b of S.books){
    const v = b.判定;
    if (v !== "踢掉") c.全部++;
    if (c[v] !== undefined) c[v]++;
  }
  return c;
}

/* 清单计数(踢掉的不算): 一本书在几个清单里就算几次 —— 清单是多对多 */
function listCounts(){
  const by = {};
  for (const b of S.books){
    if (b.判定 === "踢掉") continue;
    for (const n of (b.清单 || [])) by[n] = (by[n]||0)+1;
  }
  return by;
}

/* 当前清单空了(最后一本被踢走) → 退回「全部」。这件事只能在数据真的变了的时候做:
   以前它藏在 render 里, 改完 S.topic 却不重画列表, 于是中栏全白、表头还写着旧清单名 */
function syncTopic(){
  if (S.topic === "全部") return false;
  if (S.topic in listCounts()) return false;
  S.topic = "全部";
  return true;
}

function listsRailHTML(){
  const by = listCounts();
  const t = Object.entries(by).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0], "zh"));
  return secHead("topics", "清单") + t.map(([k,n],i)=>
    `<div class="itemwrap">
       <button class="item${S.topic===k?" on":""}" data-topic="${esc(k)}" title="再点一次取消筛选">
         <span class="ix" aria-hidden="true">${toRoman(i+1)}</span>
         <span class="lb">${esc(k)}</span><span class="n num">${n}</span></button>
       <button class="ren" data-ren="${esc(k)}" title="给这个清单改名" aria-label="给「${esc(k)}」改名">
         <svg class="ic ic-xs" aria-hidden="true"><use href="#i-pen"/></svg></button>
     </div>`).join("");
}

/* 左栏两个分组标题: 点一下折起来, 状态记在 localStorage(下次打开还是折着的) */
const FOLD = (()=>{ try{ return JSON.parse(localStorage.getItem("bl.fold") || "{}"); }catch{ return {}; } })();
const folded = k => !!FOLD[k];
function toRoman(value){
  const pairs = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
    [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let n = Math.max(0, Number(value) || 0);
  let out = "";
  for (const [unit, glyph] of pairs){ while (n >= unit){ out += glyph; n -= unit; } }
  return out;
}
function secHead(k, label){
  return `<button class="sec-h" data-fold="${k}" aria-expanded="${!folded(k)}">
    <span class="sec-label">${esc(label)}</span>
    <span class="sec-line" aria-hidden="true"></span>
    <span class="cv" aria-hidden="true"></span></button>`;
}
function applyFold(){
  for (const k of ["shelves", "topics"]) $("#" + k).classList.toggle("folded", folded(k));
}

/* 习惯按每天累计满 3600 秒计算；今天未完成时，连续记录从昨天继续，不把今天算作断档。 */
const HABIT_GOAL = 3600;
const HABIT_STRIP_COLORS = ["#3F7467","#B28748","#41778B","#5F7B57",
  "#B45D51","#8A6942"];
const habitMemoryDay = {};
function habitDayKey(offset){
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - offset);
  return ymd(d);
}
function habitStreak(days){
  let offset = (days[habitDayKey(0)] || 0) >= HABIT_GOAL ? 0 : 1;
  let n = 0;
  while (n < 3660 && (days[habitDayKey(offset)] || 0) >= HABIT_GOAL){ n++; offset++; }
  return n;
}
function habitCelebrate(streak, surface){
  const key = "bl.habitLastStreak:" + (surface || "card");
  let prev = NaN;
  try{
    const raw = localStorage.getItem(key);
    prev = raw == null ? NaN : Number(raw);
    localStorage.setItem(key, String(streak));
  }catch{}
  return streak >= 7 && (!Number.isFinite(prev) || prev < 7);
}
function habitDailyCelebrate(done, surface){
  if (!done) return false;
  const slot = surface || "card";
  const day = habitDayKey(0);
  let prev = "";
  try{
    prev = localStorage.getItem("bl.habitDaily:" + slot) || "";
    localStorage.setItem("bl.habitDaily:" + slot, day);
  }catch{
    prev = habitMemoryDay[slot] || "";
    habitMemoryDay[slot] = day;
  }
  return prev !== day;
}
function habitBurstHTML(count){
  return `<span class="habit-burst" aria-hidden="true">${Array.from({length:count || 9}, (_, i) => {
    const x = 12 + i * (76 / Math.max(1, (count || 9) - 1));
    return `<i style="--x:${x}%;--dx:${(i - 4) * 5}px;--r:${-18 + i % 3 * 18}deg;` +
      `--r2:${-4 + i % 4 * 12}deg;--c:${HABIT_STRIP_COLORS[i % HABIT_STRIP_COLORS.length]};` +
      `--i:${i}"></i>`;
  }).join("")}</span>`;
}
function habitCardHTML(days){
  const sec = Math.max(0, Number(days[habitDayKey(0)]) || 0);
  const done = sec >= HABIT_GOAL;
  const rem = Math.max(0, HABIT_GOAL - sec);
  const remMin = Math.ceil(rem / 60);
  const readMin = Math.floor(sec / 60);
  const progress = Math.min(100, sec / HABIT_GOAL * 100);
  const streak = habitStreak(days);
  const celebrate = habitCelebrate(streak, "card");
  const dailyCelebrate = habitDailyCelebrate(done, "card");
  const week = daysBack(7).map((k, i) => {
    const daySec = Math.max(0, Number(days[k]) || 0);
    const d = new Date(k + "T12:00:00");
    const wd = i === 6 ? "今" : "日一二三四五六"[d.getDay()];
    const h = daySec ? Math.max(3, Math.round(Math.min(daySec / HABIT_GOAL, 1) * 27)) : 1;
    return `<span class="rh-day${i === 6 ? " today" : ""}" title="${k} · ${daySec ? Math.round(daySec / 60) + " 分钟" : "没读"}">
      <span class="rh-bar"><i class="${daySec >= HABIT_GOAL ? "full" : ""}" style="height:${h}px"></i></span>
      <span class="rh-wd">${wd}</span></span>`;
  }).join("");
  const seven = Array.from({length:7}, (_, i) =>
    `<i class="${i < Math.min(7, streak) ? "on" : ""}" style="--i:${i}"></i>`).join("");
  const main = done
    ? `<span class="rh-num done">满一小时</span>`
    : `<span class="rh-num">${remMin}</span><span class="rh-unit">分钟</span>`;
  const sub = done
    ? `已读 ${readMin} 分钟${sec > HABIT_GOAL ? " · 超出 " + Math.floor((sec - HABIT_GOAL) / 60) + " 分" : ""}`
    : `已读 ${readMin} 分钟`;
  return `<button class="habit-card${S.habit ? " on" : ""}${dailyCelebrate ? " just-day" : ""}${celebrate ? " just-seven" : ""}"
      data-habit="1" title="打开习惯养成" aria-label="${done ? "今天已读满一小时" : "今天还差 " + remMin + " 分钟"}">
    ${dailyCelebrate ? habitBurstHTML(7) : ""}
    <span class="rh-top"><span class="rh-k">今天${done ? "已达标" : "还差"}</span>
      <span class="rh-streak">连续<b>${streak}</b>天</span></span>
    <span class="rh-main">${main}</span>
    <span class="rh-sub">${sub}</span>
    <span class="rh-prog"><i style="width:${progress}%"></i></span>
    <span class="rh-week">${week}</span>
    <span class="rh-foot"><span>每天满一小时</span><span class="rh-seven">${seven}</span></span>
  </button>`;
}
function renderHabit(){
  const box = $("#habitSec");
  if (!box) return;
  if (!S.rdAvail){
    box.innerHTML = "";
    return;
  }
  const days = (S.rd && S.rd.days) || {};
  box.innerHTML = `<div class="habit-head"><span>习惯养成</span><i class="ln"></i></div>
    ${habitCardHTML(days)}`;
}
let habitRefreshBusy = false;
async function refreshHabit(){
  if (habitRefreshBusy || document.hidden) return;
  habitRefreshBusy = true;
  try{
    const r = await fetch("/api/readest");
    if (!r.ok) return;
    const rd = await r.json();
    if (!rd || !rd.available) return;
    const before = JSON.stringify((S.rd && S.rd.days) || {});
    const after = JSON.stringify(rd.days || {});
    S.rd = rd;
    S.rdAvail = true;
    if (before !== after){
      renderHabit();
      if (S.habit) renderHabitPage();
    }
  }catch{}
  finally{ habitRefreshBusy = false; }
}
function startHabitRefresh(){
  setInterval(refreshHabit, 60000);
  window.addEventListener("focus", refreshHabit);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshHabit();
  });
}

/* ── 左栏 ─────────────────────────────────────────── */
function renderRail(){
  const c = counts();
  $("#shelves").innerHTML = secHead("shelves", "书架") + SHELVES.map(([key,label])=>
    `<button class="item${S.shelf===key?" on":""}${key==="踢掉"?" drop":""}" data-shelf="${esc(key)}">
       <span class="lb">${esc(label)}</span><span class="n num">${c[key]}</span></button>`).join("")
    + (S.rdAvail ? `<button class="item stats-entry${S.stats?" on":""}" data-stats="1">
         <span class="lb">阅读统计</span><span class="glyph" aria-hidden="true"><i></i><i></i><i></i></span></button>` : "");

  renderHabit();
  $("#topics").innerHTML = listsRailHTML();
  applyFold();

  const orphans = S.orphans.length ? `<div class="sec"><div class="sec-t">已不在底本</div>` +
    S.orphans.map(o=>`<button class="item${S.orphan===o.书名?" on":""}" data-orphan="${esc(o.书名)}"
      title="底本里没有了，可挂回或删掉">
      <span class="lb">${esc(o.书名)}</span></button>`).join("") + `</div>` : "";
  if (orphans && !$("#orph")) { $("#topics").insertAdjacentHTML("afterend", `<div id="orph">${orphans}</div>`); }
  else if (orphans) { $("#orph").innerHTML = orphans; }
  else if ($("#orph")) { $("#orph").remove(); }
}

function railActive(){
  document.querySelectorAll(".item[data-shelf]").forEach(x=>x.classList.toggle("on", x.dataset.shelf===S.shelf));
  document.querySelectorAll(".item[data-topic]").forEach(x=>x.classList.toggle("on", x.dataset.topic===S.topic));
  document.querySelectorAll(".item[data-orphan]").forEach(x=>x.classList.toggle("on", x.dataset.orphan===S.orphan));
  document.querySelectorAll(".item[data-stats]").forEach(x=>x.classList.toggle("on", !!S.stats));
  document.querySelectorAll(".habit-card[data-habit]").forEach(x=>x.classList.toggle("on", !!S.habit));
}

/* 点一本书 = 推开第二层详情页 */
function select(name, source){
  closeMenu();
  if (FOLIO.busy && S.open && S.sel === name && !S.orphan) return;
  S.orphan = null; S.sel = name; S.open = true;
  document.querySelectorAll(".row").forEach(x=>x.classList.toggle("sel", x.dataset.name===name));
  document.querySelectorAll(".item[data-orphan]").forEach(x=>x.classList.remove("on"));
  renderDetail();
  openFolio(source);
}

/* 退回书目页: 详情页滑走, 但选中的那本还留着(回来还是它) */
function hideDetail(){
  closeMenu();
  S.open = false; S.orphan = null;
  if (S.stats || S.habit){
    S.stats = false; S.habit = false;
    railActive(); renderList();
  }
  closeFolio();
}

async function goHome(){
  await flushPending();
  S.open = false; S.orphan = null;
  S.stats = false; S.habit = false;
  S.shelf = "全部"; S.topic = "全部"; S.q = "";
  const q = $("#q");
  if (q) q.value = "";
  if (S.picked.size) pickNone();
  document.body.classList.remove("stats-view", "habit-view");
  railActive(); renderList(); renderDetail();
}

/* ── 列表 ─────────────────────────────────────────── */
function tagOf(b){
  if (!b.判定) return "";
  const d = b.判定 === "读完" ? shortDate(b.读完日) : (b.判定 === "在读" ? shortDate(b.开始日) : "");
  // 判定在列表和右栏用同一套颜色(文件开头就写着这条): 在读是蓝的, 读完是黄的, 踢掉是红的。
  // 「想读」刻意不上色 —— 它是待办默认态, 上了色会跟「当前选中」那一抹绿撞车。
  const cls = b.判定 === "读完" ? "tag done" : (b.判定 === "在读" ? "tag ing"
    : (b.判定 === "踢掉" ? "tag drop" : "tag"));
  const parts = [esc(b.判定)];
  if (b.判定 === "读完" && b.评价) parts.push(`<span class="ev ${EVAL_CLS[b.评价]||""}">${esc(b.评价)}</span>`);
  if (d) parts.push(esc(d));
  return `<span class="${cls}">${parts.join('<span class="dot">·</span>')}</span>`;
}

/* 日期栏不再放「今天」快捷按钮；有值时只保留一个轻量清空记号。 */
function miniFor(key, val){
  const label = key === "开始日" ? "开始读" : "读完";
  const html = val
    ? `<button class="ic-btn clr" data-clear="${key}" aria-label="清空${label}日期" title="清空"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>`
    : "";
  const t = document.createElement("div");
  t.innerHTML = html;
  return `<span class="date-tail" data-tail="${key}">${t.innerHTML}</span>`;
}

function miniEl(key, val){
  const t = document.createElement("div");
  t.innerHTML = miniFor(key, val);
  return t.firstElementChild;
}

/* 一次落盘: 先动本地(界面立刻响应), 单本失败就整个退回, 成功就留一条可撤销记录 */
async function commitBook(b, patch, keys, label){
  const prev = snapshot(b, keys);
  const before = visible().map(x=>x.书名);          // 动之前先记下它在第几个, 被筛掉时要落到原位
  const idx = Math.max(0, before.indexOf(b.书名));
  Object.assign(b, patch);
  const stay = matches(b);
  if (stay) updateRow(b); else collapse(b.书名);
  renderCounts();
  if (S.sel === b.书名){
    if (stay) renderDetail();
    else {                                          // 这本被当前筛选筛掉了 → 右栏落到原位那本
      const after = visible().map(x=>x.书名);        // (停在已经不显示的书上, 右栏就成了一块墓碑)
      S.sel = after.length ? after[Math.min(idx, after.length-1)] : null;
      document.querySelectorAll(".row").forEach(el=>el.classList.toggle("sel", el.dataset.name===S.sel));
      renderDetail();
    }
  }
  pushUndo(prev, label);
  try{
    const res = await post(b.书名, patch);
    if (res && res.书名 && res.书名 !== b.书名){ await load(); return true; }
    if (res && res.记录) patchLocal(b.书名, res.记录);
    return true;
  }catch(e){
    Object.assign(b, prev);
    renderList(); renderDetail();
    showToast("没存上：" + e.message, false);
    return false;
  }
}

const PRIO_CLS = {"高":"hi","中":"mid","低":"lo"};
const CLOTH = {"社科":"#383832","心理":"#413831","科学":"#2d3c3e","商业/经济":"#4a4033",
  "方法/工具":"#3e4939","文学":"#54362f","传记":"#4a3f35","历史":"#49382f"};
function clothColor(category){
  const k = String(category || "");
  const hit = Object.keys(CLOTH).find(x=>k.includes(x));
  return hit ? CLOTH[hit] : "#3d3730";
}
function placeholderCover(b, detail){
  const p = (b.封面 && b.封面.placeholder) || {};
  const title = p.title || b.书名 || "";
  const author = p.author || b.作者 || "";
  const no = String(p.id || b.id || "").padStart(3,"0");
  return `<span class="cover-cloth" style="--cloth:${clothColor(p.category || b.类别)}" role="img"
    aria-label="${esc(title)}的精装占位封面">
    <span class="cloth-inner">
      <span class="cl-no">${esc(no)}</span>
      <span class="cl-title">${esc(title)}</span>
      <span class="cl-mark" title="${esc(author)}"></span>
    </span>

}
function coverHTML(b, detail){
  const c = b.封面 || {};
  const w = detail ? 132 : 30, h = detail ? 198 : 44;
  const cls = "cover" + (detail ? " detail-cover" : "");
  if (c.state === "ready" && c.thumb){
    const src = detail ? (c.full || c.thumb) : c.thumb;
    return `<span class="${cls}" data-cover-state="ready">
      <img src="${esc(src)}" ${detail && c.full ? `data-full="${esc(c.full)}"` : ""}
        width="${w}" height="${h}" loading="${detail ? "eager" : "lazy"}" decoding="async"
        fetchpriority="${detail ? "high" : "auto"}" alt="${esc(b.书名)}书封">
      ${placeholderCover(b, detail)}
    </span>`;
  }
  return `<span class="${cls}" data-cover-state="${esc(c.state || "placeholder")}">
    ${placeholderCover(b, detail)}</span>`;
}
function preloadCover(b){
  const src = b && b.封面 && b.封面.full;
  if (!src) return Promise.resolve(false);
  return new Promise(resolve=>{
    const im = new Image();
    im.onload = ()=> { const done=()=>resolve(true); (im.decode ? im.decode().catch(()=>{}).then(done) : done()); };
    im.onerror = ()=>resolve(false);
    im.src = src;
  });
}

   以前还塞「有感想」这类提示, 一屏 16 行全是重复噪声 —— 感想在右栏写着, 不必在这儿报数。 */
function metaHTML(b){

/* ── Readest 阅读: 时长口径与详情块 ─────────────────── */
function shortDur(sec){
  sec = Math.max(0, Math.round(sec || 0));
  if (!sec) return "0m";
  let h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (m === 60){ h += 1; m = 0; }
  if (h) return h + "h" + (m ? m + "m" : "");
  return m + "m";
}
function durText(sec){
  sec = Math.max(0, Math.round(sec || 0));
  if (!sec) return "0 分钟";
  let h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (m === 60){ h += 1; m = 0; }
  if (h && m) return h + " 小时 " + m + " 分";
  if (h) return h + " 小时";
  return m + " 分钟";
}
const ymd = d => d.toLocaleDateString("sv-SE");
function daysBack(n){
  const out = [], t = new Date();
  for (let i = n - 1; i >= 0; i--){
    const d = new Date(t); d.setDate(t.getDate() - i); out.push(ymd(d));
  }
  return out;
}
function barsFor(days, n, maxH){
  const dates = daysBack(n);
  const max = Math.max(60, ...dates.map(d=>days[d] || 0));
  maxH = maxH || 32;
  return dates.map(d=>{
    const s = days[d] || 0;
    const h = s ? Math.max(2, Math.round(s / max * maxH)) : 1;
    const tip = d + (s ? " · " + Math.round(s / 60) + " 分钟" : " · 没读");
    return `<i class="${s >= 3600 ? "hot" : ""}" style="height:${h}px" title="${esc(tip)}"></i>`;
  }).join("");
}
function rdBlock(r){
  const pr = r.进度 || [0, 0], cur = pr[0], tot = pr[1];
  const pct = tot ? Math.min(100, Math.round(cur / tot * 100)) : 0;
  return `<div class="field rd">
    <label>Readest 阅读</label>
    <div class="rl"><span class="k">开始</span><span class="v num">${esc(r.开始日 || "—")}</span>
      <span class="sep">·</span><span class="k">最近</span><span class="v num">${esc(r.最近日 || "—")}</span>
      <span class="sep">·</span><span class="v num">读了 ${r.天数} 天</span></div>
    <div class="rl"><span class="k">有效阅读</span><span class="v num">${durText(r.秒)}</span>
      <span class="sep">·</span><span class="k">进度</span>
      <span class="v num">${cur}/${tot}${tot ? `（${pct}%）` : ""}</span></div>
    ${r.读完日 ? `<div class="rl"><span class="k">读完</span><span class="v num">${esc(r.读完日)}</span></div>` : ""}
    <div class="bars" aria-label="最近 14 天每日阅读分钟数">${barsFor(r.每日 || {}, 14, 32)}</div>
    <div class="hint">每页最多计 120 秒、2 分钟不翻页就暂停；这是有效阅读的下限。</div>
  </div>`;
}

/* ── 阅读统计页 ─────────────────────────────────────── */
const RDRANGE_KEYS = ["week", "month", "year"];
const RDRANGE_LABEL = { week:"本周", month:"本月", year:"本年" };

/* 三档范围都按本机日期、周一起始; 本年只数今年的格子, 跨年的两头留空 */
function rdRangeInfo(rng){
  const now = new Date(); now.setHours(0, 0, 0, 0);
  let s, e;
  if (rng === "week"){
    s = new Date(now); s.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    e = new Date(s); e.setDate(s.getDate() + 6);
  } else if (rng === "month"){
    s = new Date(now.getFullYear(), now.getMonth(), 1);
    e = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  } else {
    s = new Date(now.getFullYear(), 0, 1);
    e = new Date(now.getFullYear(), 11, 31);
  }
  const dates = [];
  for (const d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) dates.push(ymd(d));
  return { s, e, dates };
}
const rdLv = s => !s ? 0 : s < 900 ? 1 : s < 1800 ? 2 : s < 3600 ? 3 : 4;
function rdCell(k, days){
  const s = days[k] || 0;
  const tip = k + " · " + (s ? Math.round(s / 60) + " 分钟" : "没读");
  return `<i class="l${rdLv(s)}" data-date="${k}" title="${esc(tip)}"></i>`;
}
function rdRangeSum(days, info){
  let sec = 0, n = 0;
  for (const k of info.dates){
    const s = days[k] || 0;
    sec += s;
    if (s >= 60) n++;
  }
  return { sec, n };
}
function rdRangeName(rng, info){
  if (rng === "week") return shortDate(ymd(info.s)) + " — " + shortDate(ymd(info.e));
  if (rng === "month") return info.s.getFullYear() + " 年 " + (info.s.getMonth() + 1) + " 月";
  return info.s.getFullYear() + " 年";
}
function rdHeatHTML(days, rng){
  const info = rdRangeInfo(rng);
  if (rng === "week"){
    const wd = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    return `<div class="hm week">` + info.dates.map((k, i) => {
      const s = days[k] || 0;
      return `<div class="hwd"><span class="k">${wd[i]}</span>${rdCell(k, days)}
        <span class="d num">${esc(shortDate(k))}</span>
        <span class="m num">${s >= 60 ? shortDur(s) : "—"}</span></div>`;
    }).join("") + `</div>`;
  }
  if (rng === "month"){
    const lead = (info.s.getDay() + 6) % 7;
    const cells = Array.from({ length: lead }, () => `<span class="ph"></span>`);
    for (const k of info.dates){
      const s = days[k] || 0;
      const tip = k + " · " + (s ? Math.round(s / 60) + " 分钟" : "没读");
      cells.push(`<i class="l${rdLv(s)} day" data-date="${k}" title="${esc(tip)}">` +
        `<b>${Number(k.slice(8))}</b>${s >= 60 ? `<em>${Math.round(s / 60)}′</em>` : ""}</i>`);
    }
    const trail = (7 - (lead + info.dates.length) % 7) % 7;
    for (let i = 0; i < trail; i++) cells.push(`<span class="ph"></span>`);
    return `<div class="wdh"><span>一</span><span>二</span><span>三</span><span>四</span>` +
      `<span>五</span><span>六</span><span>日</span></div>` +
      `<div class="hm month">${cells.join("")}</div>`;
  }
  /* 一年 = 53 列 × 7 行, 跟 GitHub 那种一列一周的排法一致 */
  const start = new Date(info.s);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const end = new Date(info.e);
  end.setDate(end.getDate() + (6 - ((end.getDay() + 6) % 7)));
  const cells = [], labels = [];
  let placed = -1;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    if (d < info.s || d > info.e){ cells.push(`<span class="ph"></span>`); continue; }
    if (d.getDate() === 1){
      const col = Math.floor((d - start) / 864e5 / 7);
      if (col !== placed){
        labels.push(`<span style="grid-column:${col + 1}">${d.getMonth() + 1} 月</span>`);
        placed = col;
      }
    }
    cells.push(rdCell(ymd(d), days));
  }
  return `<div class="hmyears">${labels.join("")}</div>
    <div class="hmscroll"><div class="hm year">${cells.join("")}</div></div>
    <div class="hmx"><span>少</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>多</span></div>`;
}
function statsHTML(rd){
  const t = rd.totals || {};
  const days = rd.days || {};
  const rng = RDRANGE_KEYS.includes(S.rdRange) ? S.rdRange : "year";
  const info = rdRangeInfo(rng), rs = rdRangeSum(days, info);

  const un = (rd.unmatched || []).map(u =>

      <span>${esc(u.开始日 || "—")} → ${esc(u.读完日 || u.最近日 || "—")}</span></div>`).join("");
  return `<div class="sum">
      <div><div class="n num"><span class="v">${rs.n}</span><small>天</small></div><div class="l">${esc(label)}读过</div></div>
      <div><div class="n num"><span class="v">${shortDur(rs.sec)}</span></div><div class="l">${esc(label)}有效阅读</div></div>
      <div><div class="n num"><span class="v">${shortDur(maxDay)}</span></div><div class="l">最长一天</div></div>
      <div><div class="n num"><span class="v">${t.连续天 || 0}</span><small>天</small></div><div class="l">连续阅读</div></div>
    </div>
    <div class="blk"><div class="t"><span>阅读日历</span>
        <span class="s num">${esc(rdRangeName(rng, info))} · ${rs.n} 天 · ${shortDur(rs.sec)}</span>
        <span class="hmsel num" id="hmsel"></span>
        <span class="rr" role="group" aria-label="阅读日历范围">${RDRANGE_KEYS.map(k =>
          `<button data-rdrange="${k}" class="${k === rng ? "on" : ""}" aria-pressed="${k === rng}">${RDRANGE_LABEL[k]}</button>`).join("")}
        </span></div><div class="heatwrap" id="rdcal">${rdHeatHTML(days, rng)}</div></div>
    <div class="blk"><div class="t">最近 30 天<span class="s">分钟 / 天</span></div>
      <div class="bartrend">${barsFor(rd.days || {}, 30, 72)}</div>
      <div class="barlab"><span>${esc(shortDate(daysBack(30)[0]))}</span><span>今天</span></div></div>
    <div class="blk"><div class="t">每本书</div>
      ${list.length ? `<table><thead><tr><th>书名</th><th>开始</th><th>最近</th><th>读完</th>
        <th>天数</th><th>有效阅读</th><th>进度</th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty">还没有读过任何书。</div>`}</div>
    ${un ? `<div class="blk"><div class="t">Readest 里读过、书单里没有</div><div class="un">${un}</div></div>` : ""}`;
}

/* 独立的「习惯养成」页：左栏保留小倒计时，点开是完整的今日目标与近 7 天。 */
function habitPageHTML(rd){
  const days = rd.days || {};
  const sec = Math.max(0, Number(days[habitDayKey(0)]) || 0);
  const done = sec >= HABIT_GOAL;
  const remMin = Math.ceil(Math.max(0, HABIT_GOAL - sec) / 60);
  const readMin = Math.floor(sec / 60);
  const streak = habitStreak(days);
  const dailyCelebrate = habitDailyCelebrate(done, "page");
  const celebrate = habitCelebrate(streak, "page");
  const dates7 = daysBack(7);
  const bars = dates7.map((k, i) => {
    const s = Math.max(0, Number(days[k]) || 0);
    const h = s ? Math.max(3, Math.round(Math.min(s / 5400, 1) * 96)) : 2;
    return `<span class="hp-col${i === 6 ? " today" : ""}" style="--i:${i}">
      <i class="${s >= HABIT_GOAL ? "full" : ""}" style="height:${h}px"></i></span>`;
  }).join("");
  const weekday = dates7.map((k, i) => {
    const d = new Date(k + "T12:00:00");
    return `<span class="${i === 6 ? "today" : ""}">${i === 6 ? "今" : "日一二三四五六"[d.getDay()]}</span>`;

/* 汇总数字换范围时滚到新值: 只动数字, 不动版面(等宽数字, 宽度不会跳)。
   值有三种写法:「12 天」「2h38m」「48m」—— 先拆成数, 滚完再按原写法格式化回去,
   不然「2h38m」会被当成 2 来滚, 中途闪出「1h38m」。 */
const SUMS = new Map();
function sumParsed(txt){
  const s = String(txt).trim();
  let m;
  if ((m = s.match(/^(\d+)h(?:(\d+)m)?$/)))
    return { val: +m[1] + (+(m[2] || 0)) / 60, fmt: v => {
      let h = Math.floor(v), mm = Math.round((v - h) * 60);
      if (mm >= 60){ h += 1; mm = 0; }
      if (!h) return mm + "m";
      return h + "h" + (mm ? mm + "m" : "");
    }};
  if ((m = s.match(/^(\d+)m$/)))
    return { val: +m[1], fmt: v => Math.round(v) + "m" };
  if ((m = s.match(/^(\d+)天$/)))
    return { val: +m[1], fmt: v => Math.round(v) + "天" };
  if ((m = s.match(/^(\d+(?:\.\d+)?)$/)))
    return { val: +m[1], fmt: v => (m[1].includes(".") ? v.toFixed(1) : Math.round(v) + "") };
  return null;
}
function rollSums(){
  if (reduceMotion()) return;
  document.querySelectorAll(".stats .sum .n .v").forEach((el, idx)=>{
    const p = sumParsed(el.textContent);
    if (!p) return;
    /* 按第几格记数, 不按标签文案 —— 「本月读过」和「本年读过」是同一格, 换范围才滚得起来 */
    const from = SUMS.has(idx) ? SUMS.get(idx) : p.val;
    SUMS.set(idx, p.val);
    if (Math.abs(p.val - from) < .01) return;
    const t0 = performance.now();
    const step = now => {
      const q = Math.min(1, (now - t0) / 360), e = 1 - Math.pow(1 - q, 3);
      el.textContent = p.fmt(from + (p.val - from) * e);
      if (q < 1) requestAnimationFrame(step);
      else el.textContent = p.fmt(p.val);
    };
    requestAnimationFrame(step);
  });
}

/* 统计页从左边那三根柱子展开: 先把整页 clip 成图标那么大, 再放回整页 */
function unfoldStats(stbtn){
  const st = document.querySelector("#rows .stats");
  if (!st || !stbtn || reduceMotion()) return;
  const g = stbtn.querySelector(".glyph") || stbtn;
  const gr = g.getBoundingClientRect(), br = st.getBoundingClientRect();
  if (!br.width || !br.height) return;
  const x1 = Math.max(0, gr.left - br.left), y1 = Math.max(0, gr.top - br.top);
  const x2 = Math.max(0, br.width - (gr.right - br.left));
  const y2 = Math.max(0, br.height - (gr.bottom - br.top));
  st.animate([
    {clipPath:`inset(${y1}px ${x2}px ${y2}px ${x1}px)`, opacity:.55},
    {clipPath:"inset(0 0 0 0)", opacity:1}
  ], {duration:520, easing:"cubic-bezier(.32,.72,0,1)"});
  revealStatRows();
}

/* 退出统计: 把来时那张纸原路收回去 —— 图标那一小块重新长成整页的反向,
   收的同时底下的书目页从 0.985 落回 1。220ms: 比展开(280)紧一档, 出去总比进来快。
   做法是把那页从文档流里提出来钉在视口原位, 先画好书目, 再让它盖在上面收回。 */
function foldStats(then){
  const st = document.querySelector("#rows .stats");
  const stbtn = document.querySelector("[data-stats]");
  const go = then || (()=>{});
  if (!st || !stbtn || reduceMotion()){ go(); return; }
  const g = stbtn.querySelector(".glyph") || stbtn;
  const sr = st.getBoundingClientRect(), gr = g.getBoundingClientRect();
  if (!sr.width || !sr.height){ go(); return; }
  // 图标已经滚出统计页之外(往下翻过): 没有「来时的位置」可回, 直接淡出
  const outOfView = gr.bottom < sr.top + 8 || gr.top > sr.bottom - 8;
  const x1 = Math.max(0, gr.left - sr.left), y1 = Math.max(0, gr.top - sr.top);
  const x2 = Math.max(0, sr.width - (gr.right - sr.left));
  const y2 = Math.max(0, sr.height - (gr.bottom - sr.top));
  st.remove();
  go();
  const rowsEl = $("#rows");
  if (rowsEl && !reduceMotion()){
    rowsEl.animate([{opacity:.5, transform:"scale(.985)"},{opacity:1, transform:"none"}],
      {duration:200, easing:"cubic-bezier(.32,.72,0,1)"});
  }
  if (outOfView){ st.remove(); return; }
  st.style.cssText =
    `position:fixed;left:${sr.left}px;top:${sr.top}px;width:${sr.width}px;height:${sr.height}px;` +
    `margin:0;z-index:40;pointer-events:none;overflow:hidden;background:var(--panel)`;
  st.setAttribute("aria-hidden", "true");
  document.body.appendChild(st);
  const a = st.animate([
    {clipPath:"inset(0px 0px 0px 0px)", opacity:1},
    {clipPath:`inset(${y1}px ${x2}px ${y2}px ${x1}px)`, opacity:.2}
  ], {duration:220, easing:"cubic-bezier(.55,0,.9,.35)", fill:"forwards"});
  a.onfinish = () => { st.remove(); };
}

    g.get(k).push(b);
  });
  if (g.size < 2) return flat();
  const keys = [...g.keys()].sort((a, b) => g.get(b).length - g.get(a).length || a.localeCompare(b, "zh"));
  return keys.map((k, i) =>
    `<div class="grp"><span class="gi num">${String(i + 1).padStart(2, "0")}</span>` +
      `<span class="gt">${esc(k)}</span><span class="gl"></span>` +
      `<span class="gn num">${g.get(k).length}</span></div>`
    + g.get(k).map(b => rowHTML(b, ++n)).join("")).join("");
}

/* ── 详情 ─────────────────────────────────────────── */
/* 底本备注里的主题是底本的账, 网页上加的才是能撤的账 */
function mergeLists(b, own){
  const out = [];
  if (b.主题 && b.主题 !== "未分类") out.push(b.主题);
  for (const n of (own||[])) if (!out.includes(n)) out.push(n);
  return out;
}

/* 能撤的那些(网页上加的): 底本备注里那个不算, 撤也撤不掉 */
const ownLists = b => (b.清单 || []).filter(n => n !== b.主题);

/* 低频动效统一在这里判断; 减少动效时只留颜色/透明度, 不位移、不揭示 */
function reduceMotion(){
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

/* 页眉已取消：书名与封面直接成为这一页的第一层内容。 */
function runHead(){ return ""; }

/* 整页落位后分三组淡入: 只在「换了一本」时播一次。
   同一本书再打开、保存后的重绘都不重播 —— 每天要点几十次的东西,
   第二次还演一遍就是拖时间。三组各 120ms、间隔 8ms, 176ms 内收工。 */
let lastDetailKey = "";

const FOLIO = {timers:[], busy:false, token:0, returnFocus:null};
const FOLIO_EASE = "cubic-bezier(.32,.72,0,1)";
function clearFolioTimers(){ FOLIO.timers.forEach(clearTimeout); FOLIO.timers = []; }
function revealDetail(){
  const d = $("#detail");
  if (!d || d.dataset.reveal === "ready") return;
  d.dataset.reveal = "ready";
  if (reduceMotion()){
    d.animate([{opacity:0},{opacity:1}], {duration:140, easing:"linear"});
    return;
  }
  /* 卷宗头和标题随纸页本身进入；字段按 20ms 依次退墨。
     只动 opacity：位移会让每个字段各自建层，并在 510ms 落页时集中销毁。
     末组在 410ms 前收完，早于纸页 settled，避免两个样式提交撞在一起。 */
  const sequence = [
    ...d.querySelectorAll(":scope > .field"),
    d.querySelector(":scope > .dfoot"),
    d.querySelector(":scope > .pagefolio")
  ].filter(Boolean);
  sequence.forEach((el, i) => el.animate([
    {opacity:0},
    {opacity:1}
  ], {
    duration:180,
    delay:Math.min(i, 5) * 20,
    easing:FOLIO_EASE,
    fill:"backwards"
  }));
}
async function openFolio(source){
  const stage=$("#turn-stage"), d=$("#detail");
  if(!stage || !d || (!S.sel && !S.orphan)) return;
  const token=++FOLIO.token;
  clearFolioTimers();
  FOLIO.busy=true;
  const active = document.activeElement;
  FOLIO.returnFocus = active && active !== document.body && !d.contains(active) ? active : null;
  d.dataset.reveal="wait";
  stage.setAttribute("aria-hidden","false");

  const alreadyLive=stage.classList.contains("live") && !stage.classList.contains("closed");
  stage.classList.remove("closed","closing","settled");
  if(!alreadyLive){
    stage.classList.add("live");
    void stage.offsetWidth;
  }
  stage.classList.remove("opening");
  void stage.offsetWidth;
  stage.classList.add("opening");
  preloadCover(current());

  const settle=()=>{
    if(token!==FOLIO.token || !S.open) return;
    stage.classList.add("settled");
    stage.classList.remove("opening");
    // 放开控件会重建无障碍子树；挪到下一帧，避免和纸页落位的样式提交挤成一个长任务。
    requestAnimationFrame(()=>{
      if(token!==FOLIO.token || !S.open) return;
      FOLIO.busy=false;
    });
  };
  if(reduceMotion()){
    FOLIO.timers.push(setTimeout(settle,0));
    return;
  }
  FOLIO.timers.push(setTimeout(()=>{
    if(token===FOLIO.token && S.open) revealDetail();
  },130));
  FOLIO.timers.push(setTimeout(settle,510));
}
function closeFolio(then){
  const stage=$("#turn-stage"), d=$("#detail");
  const done=typeof then==="function"?then:null;
  if(!stage){ if(done) done(); return; }
  if(stage.classList.contains("closed") && !stage.classList.contains("live")){ if(done) done(); return; }
  const token=++FOLIO.token;
  clearFolioTimers();
  FOLIO.busy=true;
  stage.classList.remove("opening","settled");
  stage.classList.add("closing");
  const finish=()=>{
    if(token!==FOLIO.token) return;
    stage.classList.add("closed");
    stage.classList.remove("closing");
    // 收起可见层之后再做可见性、焦点与 aria 提交，避免一次任务里同时重建绘制树与无障碍树。
    requestAnimationFrame(()=>{
      if(token!==FOLIO.token) return;
      // 收起后再清空可见树：隐藏整棵表单的无障碍节点会形成一次长任务，空壳隐藏则没有这项成本。
      d.innerHTML = "";
      lastDetailKey = "";
      stage.classList.remove("live");
      stage.setAttribute("aria-hidden","true");
      d.dataset.reveal="wait";
      FOLIO.busy=false;
      const target = FOLIO.returnFocus;
      FOLIO.returnFocus = null;
      if (target && target.isConnected) target.focus({preventScroll:true});
      else if (d.contains(document.activeElement)) $("#q")?.focus({preventScroll:true});
      if(done) done();
    });
  };
  FOLIO.timers.push(setTimeout(finish, reduceMotion()?150:180));
}

function chipsFor(b){
  const names = b.清单 || [];
  if (!names.length) return "";
  return names.map(n => (n === b.主题 && b.主题 !== "未分类")

}

          <button data-cover-adopt="${esc(c.key || c.remote || "")}">采用</button>

        </div>`).join("") : `<div class="mini">没有可靠候选</div>`}</div>

      <div class="cover-actions"><button data-cover-restore="1">恢复精装占位</button></div>`;
  }
}

async function coverAction(action, key){

  try{
    const r = await fetch("/api/cover/select", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:String(b.id),action,candidate:key || ""})});
    const d = await r.json().catch(()=>({}));

function chipSnapshot(){
  const rects = new Map(), nodes = new Map();
  document.querySelectorAll("#book-chips .chip[data-chip-key]").forEach(el=>{
    const key = el.dataset.chipKey;
    rects.set(key, el.getBoundingClientRect());
    nodes.set(key, el.cloneNode(true));
  });
  return {rects, nodes};
}

function playChipTransition(before, removed){
  if (!before || reduceMotion()) return;
  for (const key of removed){
    const node = before.nodes.get(key), r = before.rects.get(key);
    if (!node || !r) continue;
    node.classList.remove("chip-settle");
    node.classList.add("chip-ghost");
    Object.assign(node.style, {
      left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px"
    });
    document.body.appendChild(node);
    setTimeout(()=>node.remove(), 220);
  }
  document.querySelectorAll("#book-chips .chip[data-chip-key]").forEach((el,i)=>{
    const old = before.rects.get(el.dataset.chipKey);
    if (!old){
      el.classList.add("chip-settle");
      el.style.animationDelay = Math.min(i, 8) * 12 + "ms";
      setTimeout(()=>{ el.classList.remove("chip-settle"); el.style.animationDelay = ""; }, 260);
      return;
    }
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if (Math.abs(dx) < .5 && Math.abs(dy) < .5) return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],
      {duration:180, easing:"cubic-bezier(.23,1,.32,1)"});
  });
}

async function setLists(name, names){
  const b = find(name);
  if (!b) return false;
  const before = (b.清单||[]).slice();
  const snap = chipSnapshot();
  const removed = before.filter(n => !names.includes(n));
  b.清单 = mergeLists(b, names);                 // 先动本地, 界面立刻响应
  renderDetail(); renderCounts();
  playChipTransition(snap, removed);
  try{
    const res = await post(name, {清单: names});
    if (res && res.书名 && res.书名 !== name){ await load(); return false; }
    if (res && res.记录){
      const next = mergeLists(b, res.记录.清单);
      const changed = next.join("\u0001") !== (b.清单||[]).join("\u0001");
      b.清单 = next;
      if (changed) renderDetail();
    }
    renderCounts();
    return true;
  }catch(e){
    b.清单 = before; renderDetail(); renderCounts();
    showToast("清单没存上：" + e.message, false);
    return false;
  }
}

function placeStatusInk(fromV){
  const seg = $("#status-seg"), ink = seg && seg.querySelector(".seg-ink");
  if (!seg || !ink) return;
  const active = seg.querySelector("button.on");
  if (!active){ ink.style.opacity = "0"; return; }
  ink.style.opacity = "1";
  ink.style.width = active.offsetWidth + "px";
  const left = active.offsetLeft;
  ink.style.transform = `translateX(${left}px)`;
  if (fromV === undefined || reduceMotion()) return;
  const old = [...seg.querySelectorAll("button")].find(x => (x.dataset.v || "") === fromV);
  if (!old || old === active) return;
  const from = old.offsetLeft;
  if (Math.abs(from - left) < .5) return;
  ink.animate([{transform:`translateX(${from}px)`},{transform:`translateX(${left}px)`}],
    {duration:220, easing:"cubic-bezier(.32,.72,0,1)"});
}

function animateEvalFold(){

    {opacity:0, transform:"translateY(-3px)"},
    {opacity:1, transform:"none"}
  ], {duration:180, delay:i * 24, easing:"cubic-bezier(.23,1,.32,1)"}));
}

/* ── 状态变更 ─────────────────────────────────────── */
/* 撤销只回滚「这一步真动过的字段」: 撤一个状态, 不该把后来写的感想也吞掉。
   所以快照按调用方给的字段清单来记, 不是无脑整条存一份。 */
function snapshot(b, keys){
  const o = {书名:b.书名};
  for (const k of (keys || ["判定","开始日","读完日"])){
    o[k] = k === "阅读记录" ? JSON.parse(JSON.stringify(b[k] || [])) : (b[k] || "");
  }
  return o;
}

async function setVerdict(name, v, opts){
  const b = find(name);
  if (!b || b.判定===v){ renderDetail(); return; }
  const oldVerdict = b.判定 || "";
  const before = visible().map(x=>x.书名);
  const idx = Math.max(0, before.indexOf(name));
  const prev = snapshot(b);
  const payload = {};
  if (S.pend && S.pend.name === name){       // 同一本书有没落盘的输入 → 并进这一单
    Object.assign(payload, S.pend.patch);
    S.pend = null; clearTimeout(S.timer); S.timer = null;
  }
  payload.判定 = v;
  if (v==="在读" && !b.开始日) payload.开始日 = today();
  if (v==="读完" && !b.读完日) payload.读完日 = today();
  S.markTarget = name; S.markLock = Date.now() + 250;       // 连按数字键时, 后几下仍落在同一本
  Object.assign(b, payload);                       // 先动本地, 界面立刻响应
  const stay = matches(b);
  if (stay) updateRow(b); else collapse(name);
  renderCounts();
  if (S.sel===name){
    if (stay){
      renderDetail();
      placeStatusInk(oldVerdict);
      if (v === "读完" && oldVerdict !== "读完") animateEvalFold();
    }
    else {                                         // 选中被移走 → 落在原位置的下一本
      const after = visible().map(x=>x.书名);
      S.sel = after.length ? after[Math.min(idx, after.length-1)] : null;
      document.querySelectorAll(".row").forEach(el=>el.classList.toggle("sel", el.dataset.name===S.sel));
      renderDetail();
    }
  }
  if (!(opts && opts.undo===false)) pushUndo(prev, v);
  try {
    const res = await post(name, payload);
    if (res && res.书名 && res.书名 !== name){ await load(); return; }
    if (res && res.记录) patchLocal(name, res.记录);
  } catch(e){
    Object.assign(b, prev);                        // 失败就退回
    renderList(); renderDetail();
    showToast("没存上：" + e.message, false);
  }
}

/* ── 行内菜单(第二层) / 评价 / 彻底删除 ───────────────
   行尾那枚 ⋯ 打开一个浮层: 状态、评价、删除都在里面。列表本身只负责「这是什么书」。 */
let menuFor = null, menuAnchor = null;

function closeMenu(){
  disarmDelete();
  const m = $("#rowmenu");
  if (m){
    if (m.classList.contains("on")){
      m.classList.remove("on"); m.classList.add("closing");
      setTimeout(()=>{ if(!m.classList.contains("on")){m.classList.remove("closing");m.innerHTML="";} },120);
    }else if (!m.classList.contains("closing")) m.innerHTML = "";
  }
  document.querySelectorAll(".row.menuopen").forEach(x=>x.classList.remove("menuopen"));
  menuFor = null; menuAnchor = null;
}

function menuHTML(b){
  const st = ["想读","在读","读完","踢掉"].map(v=>
    `<button data-mv="${esc(v)}" class="${b.判定===v?"on":""}">${esc(v)}</button>`).join("");
  const ev = (b.判定 === "读完")
    ? `<hr><div class="mt">这本怎么样</div><div class="segs">${
        EVALS.map(e=>`<button data-e="${esc(e)}" class="${b.评价===e?"on":""}">${esc(e)}</button>`).join("")
      }</div>` : "";
  return `<div class="mt">状态</div>${st}
    ${ev}
    <hr>
    <button class="danger" id="rm-del">从书单删除</button>`;
}

function openMenu(name, anchor){
  const m = $("#rowmenu"), b = find(name);
  if (!m || !b || !anchor){ closeMenu(); return; }
  menuFor = name; menuAnchor = anchor;
  m.classList.remove("closing"); m.innerHTML = menuHTML(b);
  m.classList.add("on");
  document.querySelectorAll(".row").forEach(x=>x.classList.toggle("menuopen", x.dataset.name===name));
  const r = anchor.getBoundingClientRect();          // 贴着那一行放, 出界就夹回来
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.right - mw, window.innerWidth - mw - 10);
  let y = r.bottom + 6;
  if (y + mh > window.innerHeight - 10) y = Math.max(10, r.top - mh - 6);
  m.style.left = Math.max(10, x) + "px";
  m.style.top = y + "px";
  /* 长出点 = 点它那枚 ⋯ 的位置(菜单自身坐标系), 才不会像从天上掉下来 */
  m.style.setProperty("--menu-ox", Math.round(r.left - Math.max(10, x) + 8) + "px");
  m.style.setProperty("--menu-oy", Math.round(r.top - y + 10) + "px");
}

function refreshMenu(){
  if (!menuFor || !menuAnchor || !document.contains(menuAnchor)) return closeMenu();
  if (!find(menuFor)) return closeMenu();
  openMenu(menuFor, menuAnchor);
}

/* 删除先浸墨两秒再确认: 第一次点只是起计时, 第二次才真的删。 */
let deleteArm = null;
function disarmDelete(btn){
  if (!deleteArm) return;
  clearTimeout(deleteArm.timer);
  const armed = deleteArm.btn;
  armed.dataset.arm = "";
  armed.classList.remove("armed", "counting");
  armed.textContent = deleteArm.label;
  deleteArm = null;
  if (btn && btn !== armed) return;
}
function armDelete(btn){
  if (deleteArm && deleteArm.btn !== btn) disarmDelete();
  if (deleteArm && deleteArm.btn === btn){ disarmDelete(btn); return; }
  deleteArm = {btn, label:btn.textContent, timer:null};
  btn.dataset.arm = "1";
  btn.textContent = "再点一下删除";
  btn.classList.add("armed", "counting");
  deleteArm.timer = setTimeout(()=>disarmDelete(btn), 2000);
}

/* 彻底删掉这条记录(判定/感想/日期/读过哪天全没), 跟「踢掉」不是一回事 */
async function deleteRec(name, btn){
  if (!btn.dataset.arm){ armDelete(btn); return; } // 不可恢复 → 两秒内点第二下
  disarmDelete(btn);
  const b = find(name);
  try{
    const r = await fetch("/api/delete", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({书名:name, 序号:(b && b.id) || ""})});
    const d = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  }catch(err){ showToast("删不掉：" + err.message, false); return; }
  closeMenu();
  S.undo.length = 0;                           // 整条都没了, 之前那几步「撤销」也失去意义
  await load();
  showToast("已从书单删掉", false);
}

function collapse(name){
  const list = [...document.querySelectorAll(".row")];
  const el = list.find(x=>x.dataset.name===name);
  if (!el) return;
  el.classList.add("leaving");          // 先断指针: 这 160ms 里下面那本会滑到鼠标底下
  if (reduceMotion()){
    el.remove(); renderEmptyIfNeeded(); return;
  }
  /* 先记下每一行的真实位置, 再让这一行淡出轻移; 删掉后其余行从旧位置滑回新位置(FLIP)。
     只动 transform/opacity, 列表不会因为 height/padding 的逐帧布局而抖。 */
  const before = new Map(list.map(r=>[r, r.getBoundingClientRect().top]));
  const a = el.animate([
    {opacity:1, transform:"translateY(0)"},
    {opacity:0, transform:"translateY(-6px)"}
  ], {duration:160, easing:"cubic-bezier(.23,1,.32,1)", fill:"forwards"});
  a.onfinish = () => {
    el.remove();
    for (const r of document.querySelectorAll(".row")){
      const old = before.get(r);
      if (old === undefined) continue;
      const dy = old - r.getBoundingClientRect().top;
      if (Math.abs(dy) < 0.5) continue;
      r.animate([{transform:`translateY(${dy}px)`}, {transform:"none"}],
        {duration:240, easing:"cubic-bezier(.23,1,.32,1)"});
    }
    renderEmptyIfNeeded();
  };
}

function renderEmptyIfNeeded(){
  if (document.querySelector(".row")) return;
  if (syncTopic()){ renderRail(); renderList(); renderDetail(); return; }   // 这个清单被踢空了 → 退回全部
  const rows = visible();
  if (!rows.length) $("#rows").innerHTML = `<div class="empty">${emptyText()}</div>`;
}

/* ── 撤销 ─────────────────────────────────────────── */
/* ── 批量标记 ─────────────────────────────────────── */
function syncPick(one){
  const rows = one ? [one] : [...document.querySelectorAll(".row")];
  for (const r of rows){
    const on = S.picked.has(r.dataset.name);
    r.classList.toggle("picked", on);
    const p = r.querySelector(".pick");
    if (p) p.setAttribute("aria-pressed", String(on));
  }
  document.body.classList.toggle("bulk", S.bulk);
  const cnt = $("#bulkcnt");
  if (cnt) cnt.innerHTML = S.picked.size
    ? `已选 <b>${S.picked.size}</b> 本`
    : `<span title="按 x 勾选, 或点右边的「全选这 N 本」">勾选要一起改的书</span>`;
  const all = $("#pickall");
  if (all){ all.textContent = `全选这 ${visible().length} 本`; all.title = "把这一栏里的书全勾上"; }
}

function animatePickCascade(centerName){
  if (reduceMotion()) return;
  const rows = [...document.querySelectorAll(".row")];
  const center = Math.max(0, rows.findIndex(r => r.dataset.name === centerName));
  rows.map((row, i) => ({row, d:Math.abs(i - center), i}))
    .filter(x => x.row.classList.contains("picked"))
    .sort((a,b) => a.d - b.d || a.i - b.i)
    .forEach(({row}, i) => {
      const mark = row.querySelector(".pick");
      if (!mark) return;
      mark.animate([
        {opacity:.22, transform:"scale(.58)"},
        {opacity:1, transform:"scale(1.06)", offset:.7},
        {opacity:1, transform:"scale(1)"}
      ], {duration:180, delay:Math.min(i, 24) * 16, easing:"cubic-bezier(.23,1,.32,1)"});
    });
}

function pickToggle(name){
  const added = !S.picked.has(name);
  if (S.picked.has(name)) S.picked.delete(name);
  else { S.picked.add(name); S.bulk = true; }
  if (!S.picked.size) S.bulk = false;             // 一个都不剩了 → 自己退出批量模式
  syncPick();
  if (added) animatePickCascade(name);
}

function pickAll(){
  const firstNew = visible().find(b => !S.picked.has(b.书名));
  for (const b of visible()) S.picked.add(b.书名);
  S.bulk = S.picked.size > 0;
  syncPick();
  if (firstNew) animatePickCascade(firstNew.书名);
}

function pickNone(){ S.picked.clear(); S.bulk = false; syncPick(); }
function bulkExit(){ S.picked.clear(); S.bulk = false; syncPick(); }

async function bulkApply(v){
  if (!VERDICTS.includes(v)) return;
  await flushPending();
  const names = visible().map(b=>b.书名).filter(n=>S.picked.has(n));
  if (!names.length) return;
  const items = names.map(n=>{
    const b = find(n), it = {书名:n};
    if (b.id) it.序号 = b.id;
    it.判定 = v;
    if (v === "在读" && !b.开始日) it.开始日 = today();
    if (v === "读完" && !b.读完日) it.读完日 = today();
    if (v === ""){ it.开始日 = ""; it.读完日 = ""; }
    return it;
  });
  let data;
  try{
    const r = await fetch("/api/bulk", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({items})});
    data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  }catch(e){ showToast("批量没改上：" + e.message, false); return; }
  const changes = (data.改动 || []).map(c=>({书名:c.书名, 前:c.前, 后:c.后}));
  if (changes.length) S.undo.push({items:changes, label:"批量 · " + v});
  bulkExit();
  await load();                                   // 整批改完再取一次真数据, 不做乐观更新
  showToast(`已标为 ${v}（${changes.length} 本）`, changes.length > 0);
}

/* 批量撤销: 只回滚「这一步真动过的字段」; 那之后自己又改过的书不碰, 只报一声 */
async function undoBulk(last){
  const items = [], stale = [];
  for (const x of last.items){
    const b = find(x.书名);
    if (!b) continue;
    const patch = {};
    for (const k of Object.keys(x.后)){
      if (String(x.后[k] ?? "") === String(x.前[k] ?? "")) continue;      // 这一步没动它
      const now = k === "清单" ? (b.清单 || []).join("\u0001") : String(b[k] ?? "");
      if (now === String(x.后[k])) patch[k] = x.前[k];
    }
    if (Object.keys(patch).length){
      const it = {书名:x.书名};
      if (b.id) it.序号 = b.id;
      items.push(Object.assign(it, patch));
    } else stale.push(x.书名);
  }
  if (!items.length){ showToast("这几本在你之后又改过，没有回滚", false); return; }
  try{
    const r = await fetch("/api/bulk", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({items})});
    const d = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  }catch(e){ showToast("撤销没存上：" + e.message, false); return; }
  S.markLock = 0;
  await load();
  showToast(`已撤销 ${items.length} 本` + (stale.length ? `（${stale.length} 本之后又改过，没动）` : ""),
    S.undo.length > 0);
}

function pushUndo(prev, v){
  S.undo.push({prev, label:v || "状态"});
  showToast(v ? "已标为 " + v : "已保存", true);
}

async function undo(){
  const last = S.undo.pop();
  if (!last){ showToast("没有可撤销的了", false); return; }
  await flushPending();                          // 先把没落盘的字写掉, 别跟撤销抢
  if (last.items) return undoBulk(last);         // 批量那一步: 整批一起回滚
  const {prev} = last;
  const patch = {};
  for (const k of Object.keys(prev)) if (k !== "书名") patch[k] = prev[k];
  Object.assign(find(prev.书名) || {}, patch);
  S.markLock = 0;
  renderRail(); renderList();
  /* 撤销回来要让光标落回它身上 —— 但只落光标, 不推开详情页:
     撤一步是列表上的事, 因为撤一下就弹走一整页会把人从原地拽走 */
  S.sel = prev.书名;
  document.querySelectorAll(".row").forEach(x=>x.classList.toggle("sel", x.dataset.name===S.sel));
  renderDetail();
  const el = [...document.querySelectorAll(".row")].find(x=>x.dataset.name===prev.书名);
  if (el) el.scrollIntoView({block:"nearest"});
  try { await post(prev.书名, patch); }
  catch(e){ showToast("撤销没存上：" + e.message, false); return; }
  // 栈里还有步骤就继续留着入口, 别让人以为只能撤一步
  showToast("已撤销", S.undo.length > 0);
}

function showToast(text, withUndo){
  $("#toast-t").textContent = text;
  $("#toast").classList.add("on");
  $("#toast").classList.toggle("hasundo", !!withUndo);
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(()=>$("#toast").classList.remove("on"), withUndo ? 7000 : 3200);
}

/* ── 交互绑定 ─────────────────────────────────────── */
document.addEventListener("click", async e=>{
  // 窄窗下右栏是盖住列表的浮层: 点浮层外面就收起来(不必记住 Esc)
  if (window.innerWidth <= 1180 && $("#detail").classList.contains("open")
      && !e.target.closest("#detail") && !e.target.closest("#rowmenu")){
    hideDetail();
  }
  if (e.target.closest("[data-home]")){ await goHome(); return; }
  const orph = e.target.closest("[data-orphan]");
  if (orph){
    await flushPending();
    S.orphan = orph.dataset.orphan; S.sel = null; S.open = true;
    document.querySelectorAll(".row").forEach(x=>x.classList.remove("sel"));
    railActive(); renderDetail();
    openFolio(null);
    return;
  }
  if (e.target.closest("#dclose") || e.target.closest("#dback")){ hideDetail(); return; }
  const fh = e.target.closest("[data-fold]");
  if (fh){
    const k = fh.dataset.fold, box = $("#" + k);
    const on = !box.classList.contains("folded");
    box.classList.toggle("folded", on);
    FOLD[k] = on;
    fh.setAttribute("aria-expanded", String(!on));
    try{ localStorage.setItem("bl.fold", JSON.stringify(FOLD)); }catch{}
    return;
  }
  if (e.target.closest("#retry")){ load(); return; }
  const del = e.target.closest("#orph-del");
  if (del){
    if (!del.dataset.arm){ armDelete(del); return; }
    disarmDelete(del);
    const name = S.orphan;
    if (!name) return;
    try { await post(name, {判定:"", 感想:"", 开始日:"", 读完日:""}); }
    catch(err){ showToast("删不掉：" + err.message, false); return; }
    S.orphan = null; await load(); showToast("那条记录已删掉", false);
    return;
  }
  const stbtn = e.target.closest("[data-stats]");
  if (stbtn){
    flushPending();
    S.habit = false; S.stats = true; S.open = false;
    railActive(); renderList(); renderDetail();
    unfoldStats(stbtn); growBars();          // 展开 + 柱子长起来, 只在「进统计」这一次
    return;
  }
  const habitBtn = e.target.closest("[data-habit]");
  if (habitBtn){
    flushPending();
    S.habit = true; S.stats = false; S.open = false;
    railActive(); renderList(); renderDetail();
    return;
  }
  const rr = e.target.closest("[data-rdrange]");
  if (rr){
    S.rdRange = rr.dataset.rdrange;
    try{ localStorage.setItem("bl.rdRange", S.rdRange); }catch{}
    renderStats({keep:true, ink:true});
    document.querySelector(`[data-rdrange="${S.rdRange}"]`)?.focus();
    return;
  }
  const rdb = e.target.closest("[data-rdbook]");
  if (rdb){ select(rdb.dataset.rdbook); return; }
  const shelf = e.target.closest("[data-shelf]");
  if (shelf){
    flushPending();
    if (S.picked.size) pickNone();        // 换栏就把勾清掉: 免得「已选 5 本」里 3 本已经不在眼前
    S.open = false;                       // 换书架 = 回到书目页(详情那层收走)
    const wasStats = S.stats;
    S.stats = false; S.habit = false;
    S.shelf = shelf.dataset.shelf;
    const done = ()=>{ railActive(); renderList(); renderDetail(); };
    if (wasStats) foldStats(done); else done();
    return;
  }
  const pick = e.target.closest(".pick");
  if (pick){ pickToggle(pick.dataset.pick); return; }
  if (e.target.closest("#cover-open")){ await toggleCoverPanel(); return; }
  const adopt = e.target.closest("[data-cover-adopt]");
  if (adopt){ await coverAction("adopt", adopt.dataset.coverAdopt); return; }
  const ignore = e.target.closest("[data-cover-ignore]");
  if (ignore){ await coverAction("ignore", ignore.dataset.coverIgnore); return; }
  if (e.target.closest("[data-cover-restore]")){ await coverAction("restore"); return; }
  const more = e.target.closest("[data-menu]");
  if (more){
    const nm = more.dataset.menu;
    if (menuFor === nm) closeMenu(); else openMenu(nm, more);
    return;
  }
  const ddel = e.target.closest("#d-del");      // 详情页最底下那枚, 跟行内菜单里的是同一条路
  if (ddel){
    await flushPending();
    await deleteRec(ddel.dataset.name, ddel);
    return;
  }
  if (e.target.closest("#rowmenu")){
    const nm = menuFor, ok = nm && find(nm);
    if (!ok){ closeMenu(); return; }
    const mv = e.target.closest("[data-mv]");
    if (mv){ await setVerdict(nm, mv.dataset.mv); refreshMenu(); return; }
    const ev = e.target.closest("[data-e]");
    if (ev){ await setEval(nm, ev.dataset.e); refreshMenu(); return; }
    const del = e.target.closest("#rm-del");
    if (del){ await deleteRec(nm, del); return; }
    return;                                     // 点在菜单的空白处: 什么也不做
  }
  const bv = e.target.closest(".bulkbar button[data-bv]");
  if (bv){ bulkApply(bv.dataset.bv); return; }
  if (e.target.closest("#pickall")){ pickAll(); return; }
  if (e.target.closest("#picknone")){ pickNone(); return; }
  if (e.target.closest("#bulkexit")){ bulkExit(); return; }
  const rm = e.target.closest(".chip[data-rm]");
  if (rm){
    const b = current();
    if (b) setLists(b.书名, ownLists(b).filter(x=>x !== rm.dataset.rm));
    return;
  }
  const topic = e.target.closest("[data-topic]");
  if (topic){
    const k = topic.dataset.topic;
    flushPending();
    if (S.picked.size) pickNone();
    S.open = false;                           // 换清单 = 回到书目页
    const wasStats = S.stats;
    S.stats = false; S.habit = false;
    S.topic = (S.topic === k) ? "全部" : k;   // 再点一次 = 取消
    const done = ()=>{ railActive(); renderList(); renderDetail(); };
    if (wasStats) foldStats(done); else done();
    return;
  }
  const ren = e.target.closest("[data-ren]");
  if (ren){                                   // 清单改名: 就地变成输入框, 回车才落盘
    e.stopPropagation();
    const wrap = ren.closest(".itemwrap"), old = ren.dataset.ren;
    const inp = document.createElement("input");
    inp.className = "reninput"; inp.value = old; inp.setAttribute("aria-label", "清单的新名字");
    wrap.replaceChildren(inp);
    inp.focus(); inp.select();
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (!save || !v || v === old){ renderRail(); return; }
      try{
        const r = await fetch("/api/rename", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({从: old, 到: v})});
        const d = await r.json().catch(()=>({}));
        if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
      }catch(err){ renderRail(); showToast("改不了名：" + err.message, false); return; }
      if (S.topic === old) S.topic = v;
      await load();
      showToast("「" + old + "」改成了「" + v + "」", false);
    };
    inp.addEventListener("keydown", k=>{
      if (k.key === "Enter"){ k.preventDefault(); finish(true); }
      else if (k.key === "Escape"){ k.preventDefault(); finish(false); }
    });
    inp.addEventListener("blur", ()=>finish(true));
    return;
  }

  const row = e.target.closest(".row");
  if (row){
    await flushPending();                        // 换书之前先把上一本没落盘的字写掉
    select(row.dataset.name, row.querySelector(".cover"));
    return;
  }

  const eseg = e.target.closest("#detail .seg.eval button[data-e]");
  if (eseg){ await setEval(S.sel, eseg.dataset.e); return; }
  const seg = e.target.closest("#status-seg button");
  if (seg){
    const v = seg.dataset.v || "";
    await setVerdict(S.sel, v);
    const again = document.querySelector(`#detail #status-seg button[data-v="${v}"]`);
    if (again) again.focus({preventScroll:true});   // 重渲染别把焦点甩到 body 上
    return;
  }

  const mini = e.target.closest("[data-today],[data-clear]");
  if (mini){
    const key = mini.dataset.today || mini.dataset.clear;
    const val = mini.dataset.today ? today() : "";
    await saveField(key, val);
    mini.replaceWith(miniEl(key, val));     // 填上就以 × 待命, 清空就退回「今天」
    return;
  }
  if (e.target.closest("#detail .dt")) return;
});

async function saveField(key, value){
  const b = current();
  if (!b) return;
  const prev = b[key];
  b[key] = value;
  const inp = $("#detail input[id='" + (key==="开始日" ? "d-start" : "d-done") + "']");
  if (inp){ inp.value = value; inp.classList.remove("bad"); }
  try {
    const res = await post(b.书名, {[key]: value});
    if (res && res.书名 && res.书名 !== b.书名){ await load(); return; }
    saved();
  }
  catch(e){ b[key] = prev; if (inp) inp.value = prev; showToast("日期没存上：" + e.message, false); }
}

/* 保存状态只占固定一小格: 「保存中…」→「已保存」→ 1.5 秒后淡出。
   以前是把带秒的时间戳写在这儿, 每改一个字就重排一次, 还压着下一段的标题。 */
let savedTimer = null;
function saved(){
  const s = $("#saved");
  if (!s) return;
  s.textContent = "已保存"; s.classList.add("ok", "on");
  if (!reduceMotion()){
    s.classList.remove("ink"); void s.offsetWidth; s.classList.add("ink");
    setTimeout(()=>s.classList.remove("ink"), 220);
  }
  clearTimeout(savedTimer);
  savedTimer = setTimeout(()=>{ s.classList.remove("ok", "on"); }, 1500);
}

document.addEventListener("input", e=>{
  const id = e.target.id;
  if (id === "d-start" || id === "d-done"){
    const key = id === "d-start" ? "开始日" : "读完日";
    const v = e.target.value.trim();
    const ok = v === "" || dateOk(v);
    e.target.classList.toggle("bad", !ok);
    const b = current();
    if (b && ok && b[key] !== v){ b[key] = v; queueSave(b.书名, {[key]: v}); }
    const tail = e.target.parentElement.querySelector(".date-tail");
    if (tail && ok){
      const btn = tail.querySelector("[data-clear]");
      if (!!btn !== !!v) tail.innerHTML = miniEl(key, v).innerHTML;
    }
    return;
  }
  if (id === "q"){
    if (S.picked.size) pickNone();
    S.q = e.target.value; renderList(); renderDetail(); return;
  }
  if (id === "note"){
    const b = current();
    if (!b) return;
    b.感想 = e.target.value;
    const s = $("#saved");
    if (s){
      s.textContent = "保存中…"; s.classList.add("on"); s.classList.remove("ok");
      clearTimeout(savedTimer);
      savedTimer = setTimeout(()=>{ s.classList.remove("on"); }, 4000);
    }
    queueSave(b.书名, {感想: b.感想});
    return;
  }
});

document.addEventListener("blur", e=>{
  const id = e.target.id;
  if (id !== "note" && id !== "d-start" && id !== "d-done") return;
  if (e.target.classList.contains("bad")){          // 非法日期: 无声退回上一个合法值
    const b = current();
    e.target.value = b ? (id === "d-start" ? b.开始日 : b.读完日) : "";
    e.target.classList.remove("bad");
    showToast(e.target.value ? "日期不合法，已退回 " + e.target.value : "日期不合法，这一栏留空", false);
  }
  flushPending();
}, true);

window.addEventListener("beforeunload", ()=>{ flushPending(); });

/* 悬停 120ms 才预取大图: 指针只是扫过列表时不浪费带宽, 真有意图时翻页已备好。 */
let coverPrefetchTimer = null, coverPrefetchName = "";
document.addEventListener("pointerover", e=>{
  const row = e.target.closest && e.target.closest(".row");
  if (!row || matchMedia("(hover:none), (pointer:coarse)").matches) return;
  if (coverPrefetchName === row.dataset.name) return;
  clearTimeout(coverPrefetchTimer); coverPrefetchName = row.dataset.name;
  coverPrefetchTimer = setTimeout(()=>{
    if (!row.isConnected) return;
    const b = find(row.dataset.name);
    if (b) preloadCover(b);
  }, 120);
});
document.addEventListener("pointerout", e=>{
  const row = e.target.closest && e.target.closest(".row");
  if (!row) return;
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".row");
  if (to === row) return;
  clearTimeout(coverPrefetchTimer); coverPrefetchName = "";
});

/* 日历: 指针停在某一格 → 同一列保持清楚、其余退半格; 读数落在标题右边, 不做浮窗。
   不放大格子: 网格里一缩放, 相邻格会跟着抖。 */
function hmPaint(cell){
  const wrap = cell.closest(".hm");
  if (!wrap) return;
  const cells = [...wrap.children], i = cells.indexOf(cell);
  const isYear = wrap.classList.contains("year");
  const col = isYear ? Math.floor(i / 7) : i % 7;
  cells.forEach((el, j) => {
    const same = (isYear ? Math.floor(j / 7) : j % 7) === col;
    el.classList.toggle("dim", !same);
    el.classList.toggle("col", same && el !== cell);
  });
  cell.classList.add("hl");
  const out = document.getElementById("hmsel");
  if (out){
    const k = cell.dataset.date, s = (S.rd && S.rd.days && S.rd.days[k]) || 0;
    out.textContent = shortDate(k) + " · " + (s >= 60 ? Math.round(s / 60) + " 分钟" : "没读");
  }
}
function hmClean(){
  document.querySelectorAll("#rdcal .dim,#rdcal .hl,#rdcal .col").forEach(el=>el.classList.remove("dim","hl","col"));
  const out = document.getElementById("hmsel");
  if (out) out.textContent = "";
}
document.addEventListener("pointerover", e=>{
  const cell = e.target.closest && e.target.closest("#rdcal i[data-date]");
  if (cell) hmPaint(cell);
});
document.addEventListener("pointerout", e=>{
  const from = e.target.closest && e.target.closest("#rdcal");
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#rdcal");
  if (from && !to) hmClean();
});

document.addEventListener("wheel", e=>{
  if (S.open && FOLIO.busy && e.deltaY < 0){
    e.preventDefault();
    hideDetail();
  }
}, {passive:false});

document.addEventListener("focusin", e=>{
  if (!FOLIO.busy) return;
  const d = $("#detail");
  if (!d || !d.contains(e.target)) return;
  if (FOLIO.returnFocus && FOLIO.returnFocus.isConnected){
    FOLIO.returnFocus.focus({preventScroll:true});
  } else {
    e.target.blur();
  }
}, true);

document.addEventListener("keydown", async e=>{
  if (e.key === "Tab" && FOLIO.busy){ e.preventDefault(); return; }
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if ((e.key === "Enter" || e.key === " ") && !typing && e.target.closest("[data-home]")){
    e.preventDefault(); await goHome(); return;
  }
  if (e.key === "/" && !typing && !S.stats && !S.habit){ e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape"){
    if (typing){ e.target.blur(); return; }
    if (menuFor){ closeMenu(); return; }
    if (S.bulk){ bulkExit(); return; }
    if (S.q){ S.q = ""; $("#q").value = ""; renderList(); return; }
    if (S.open){ hideDetail(); return; }
    if (S.habit){
      S.habit = false;
      document.body.classList.remove("habit-view");
      railActive(); renderList(); renderDetail();
      return;
    }
    if (S.stats){
      S.stats = false;
      foldStats(()=>{ railActive(); renderList(); renderDetail(); });
      return;
    }
    hideDetail(); return;
  }
  if (typing) return;
  if (e.key === "v" && !e.ctrlKey && !e.metaKey && !e.altKey && !S.stats && !S.habit){
    e.preventDefault();
    if (S.bulk) bulkExit();
    else {
      if (S.sel) S.picked.add(S.sel);
      S.bulk = true; syncPick(); animatePickCascade(S.sel);
    }
    return;
  }
  if (S.bulk){
    if (e.key === "x" && !e.ctrlKey && !e.metaKey && !e.altKey){
      // 没有光标(比如 Esc 收起详情之后进的批量模式)就拿第一行当光标, 别让 x 什么都不做
      const target = S.sel || (visible()[0] || {}).书名 || null;
      if (target){ e.preventDefault(); if (!S.sel) select(target); pickToggle(target); }
      return;
    }
    if (e.key === "a" && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); pickAll(); return; }
    if (e.key === "n" && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); pickNone(); return; }
  }
  if (e.key === "ArrowDown" || e.key === "j" || e.key === "ArrowUp" || e.key === "k"){
    e.preventDefault();
    const rows = visible(); if (!rows.length) return;
    const down = (e.key==="ArrowDown"||e.key==="j");
    let i = rows.findIndex(b=>b.书名===S.sel);
    if (i < 0) i = down ? -1 : rows.length;         // 选中不在当前筛选里 → 从这头进
    i += down ? 1 : -1;
    i = Math.max(0, Math.min(rows.length-1, i));
    select(rows[i].书名);
    const el = [...document.querySelectorAll(".row")].find(x=>x.dataset.name===S.sel);
    if (el) el.scrollIntoView({block:"nearest"});
    return;
  }
  const map = {"1":"想读","2":"在读","3":"读完","4":"踢掉","0":""};
  if (map[e.key] !== undefined && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (S.bulk && S.picked.size){ e.preventDefault(); bulkApply(map[e.key]); return; }   // 勾了一堆 → 整批改
    const locked = Date.now() < S.markLock;         // 刚标完 250ms 内, 连按仍然落在同一本
    const target = locked ? S.markTarget : S.sel;
    if (!target) return;
    if (!locked && !visible().some(b=>b.书名===target)){
      showToast(target + " 不在当前筛选里", false);   // 列表里看不见的书不许被偷偷改
      return;
    }
    e.preventDefault();
    setVerdict(target, map[e.key]).then(()=>{
      const el = [...document.querySelectorAll(".row")].find(x=>x.dataset.name===S.sel);
      if (el) el.scrollIntoView({block:"nearest"});
    });
    return;
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
});

/* 孤儿记录挂回底本里某本书(选完就生效) */
document.addEventListener("change", async e=>{
  if (e.target.id !== "relink") return;
  const to = e.target.value, from = S.orphan;
  if (!to || !from) return;
  try{
    const r = await fetch("/api/relink", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({书名:from, 到:to})});
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ("HTTP " + r.status));
  }catch(err){ showToast("挂不上：" + err.message, false); return; }
  S.orphan = null; S.sel = to; S.open = true; S.shelf = "全部"; S.topic = "全部";
  railActive(); await load(); showToast("已挂到 " + to, false);
});

$("#undo").addEventListener("click", undo);
$("#rows").addEventListener("scroll", closeMenu, {passive:true});
window.addEventListener("resize", closeMenu);
load();
startHabitRefresh();
</script>
